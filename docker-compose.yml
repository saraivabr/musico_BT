version: '3.8'

services:
  jesus-bot:
    build: .
    container_name: jesus-bot
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      - PORT=3008
      - MONGODB_URI=mongodb://mongo:27017/jesus-bot
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
    volumes:
      - ./bot_sessions:/app/bot_sessions

  mongo:
    image: mongo:7
    container_name: jesus-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
